<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
    DirectoryIndex index.php
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/crm-w01-test.crt
    SSLCertificateKeyFile /etc/ssl/private/crm-w01-test.key
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
    DirectoryIndex index.php
</VirtualHost>
