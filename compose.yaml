services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./ACCOUNTANT_CRM:/var/www/html
      - app_vendor:/var/www/html/vendor
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-accountant_crm}
      DB_USER: ${DB_USER:-accountant}
      DB_PASSWORD: ${DB_PASSWORD:-accountant_dev}
      CRM_SECURITY_HMAC_KEY: ${CRM_SECURITY_HMAC_KEY}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-accountant_crm}
      MARIADB_USER: ${DB_USER:-accountant}
      MARIADB_PASSWORD: ${DB_PASSWORD:-accountant_dev}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev}
    volumes:
      - db_data:/var/lib/mysql
      - ./accountant_crm.sql:/docker-entrypoint-initdb.d/001-accountant_crm.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
  app_vendor:
